[project]
name = "cost-aware-router"
version = "0.1.0"
description = "Learn from eval results when a small model is good enough; report cost per task vs quality"
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
