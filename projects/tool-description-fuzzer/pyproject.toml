[project]
name = "tool-description-fuzzer"
version = "0.1.0"
description = "Mutate tool descriptions and measure the effect on tool-selection accuracy"
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
